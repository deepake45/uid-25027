<!DOCTYPE html>
<html>
<head>
    <title>Number Programs</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
        }

        .container {
            margin-top: 50px;
            padding: 20px;
            background: white;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            padding: 10px;
            width: 80%;
            margin-bottom: 10px;
        }

        button {
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #007BFF;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #output {
            margin-top: 15px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sort 3 numbers</h2>
        <input type="number" id="num1" placeholder="Enter 1st number">
        <input type="number" id="num2" placeholder="Enter 2nd number">
        <input type="number" id="num3" placeholder="Enter 3rd number">
        <br>
        <button onclick="sortNumbers()">Sort Numbers</button>
        <div id="output"></div>
    </div>

    <script>
        function getNumber(id) {
            return parseFloat(document.getElementById(id).value);
        }

        function validateNumbers(numbers) {
            return numbers.every(num => !isNaN(num));
        }

        function sortDescending(numbers) {
            return numbers.slice().sort((a, b) => b - a);
        }

        function showOutput(message) {
            document.getElementById('output').textContent = message;
        }

        function sortNumbers() {
            const numbers = [
                getNumber('num1'),
                getNumber('num2'),
                getNumber('num3')
            ];

            if (!validateNumbers(numbers)) {
                showOutput('Please enter valid numbers.');
                return;
            }

            const sortedNumbers = sortDescending(numbers);
            showOutput(`Sorted numbers: ${sortedNumbers.join(', ')}`);
        }
    </script>
</body>
</html>
