<!DOCTYPE html>
<html>
<head>
    <title>Number Programs</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
        }

        .container {
            margin-top: 50px;
            padding: 20px;
            background: white;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            padding: 10px;
            width: 80%;
            margin-bottom: 10px;
        }

        button {
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #007BFF;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #output {
            margin-top: 15px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sign of Product of 3 numbers</h2>
        <input type="number" id="num1" placeholder="Enter 1st number">
        <input type="number" id="num2" placeholder="Enter 2nd number">
        <input type="number" id="num3" placeholder="Enter 3rd number">
        <br>
        <button onclick="checkNumber()">Check Sign</button>
        <div id="output"></div>
    </div>

    <script>
        function checkNumber() {
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;
            const num3 = document.getElementById('num3').value;
            const output = document.getElementById('output');

            if (num1 === '' || num2 === '' || num3 === '') {
                output.textContent = 'Please enter all three numbers.';
                return;
            }

            const number = parseFloat(num1) * parseFloat(num2) * parseFloat(num3);

            if (isNaN(number)) {
                window.alert('Invalid input. Please enter valid numbers.');
                return;
            }

            if (number > 0) {
                window.alert('The number is positive.');
            } else if (number < 0) {
                window.alert('The number is negative.');
            } else {
                window.alert('The number is zero.');
            }
        }
    </script>
</body>
</html>
