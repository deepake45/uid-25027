<!DOCTYPE html>
<html>
<head>
    <title>Number Programs</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
        }

        .container {
            margin-top: 50px;
            padding: 20px;
            background: white;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            padding: 10px;
            width: 80%;
            margin-bottom: 10px;
        }

        button {
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #007BFF;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #output {
            margin-top: 15px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
        }
    </style>    
</head>
<body>  
    <div class="container">
        <h2>Number 0 to 15 and even or odd</h2>
        <button onclick="checkEvenOdd()">Check Even/Odd</button>
        <div id="output"></div>
    </div>

    <script>
        function checkEvenOdd() {
            let output = document.getElementById('output');
            output.innerHTML = ''; // Clear previous output

            for (let i = 0; i <= 15; i++) {
                let type = (i % 2 === 0) ? 'even' : 'odd';
                output.innerHTML += `${i} is ${type}<br>`;
            }
        }
    </script>
</body>
</html>
