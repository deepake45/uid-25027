<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>
</head>
<body>

<script>
    let total = 0;

    for(let i = 1; i <= 6; i++) {
        let mark = parseFloat(prompt("Enter marks for Subject " + i + ":"));
        total += mark;
    }

    let average = total / 6;
    let grade;

    if(average >= 90)
        grade = "A+";
    else if(average >= 80)
        grade = "A";
    else if(average >= 70)
        grade = "B";
    else if(average >= 60)
        grade = "C";
    else if(average >= 50)
        grade = "D";
    else
        grade = "F";

    document.write("<h2>Student Result</h2>");
    document.write("Average Marks: " + average.toFixed(2) + "<br>");
    document.write("Grade: " + grade);
</script>

</body>
</html>
